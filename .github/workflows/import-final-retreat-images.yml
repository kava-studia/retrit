name: Import final retreat images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-final-retreat-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download final retreat images
        run: |
          set -euo pipefail
          mkdir -p assets/final
          curl -L --fail --retry 3 'https://at.adobe.com/H2s4WUyBHPn8vikH' -o assets/final/yoga-wide.png
          curl -L --fail --retry 3 'https://at.adobe.com/27Xg4HSZ4XFy6baf' -o assets/final/fire.png
          curl -L --fail --retry 3 'https://at.adobe.com/qkovJOjueGGMZoxy' -o assets/final/yoga-close.jpg
          file assets/final/*

      - name: Commit images
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/final/yoga-wide.png assets/final/fire.png assets/final/yoga-close.jpg
          if git diff --cached --quiet; then
            echo 'No image changes'
            exit 0
          fi
          git commit -m 'add final retreat images'
          git push
